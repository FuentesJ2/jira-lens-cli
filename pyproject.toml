[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-context-harness"
version = "0.1.0"
description = "Local CLI and MCP harness for JIRA context retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jira-context = "jira_context_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]