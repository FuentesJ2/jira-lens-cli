[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-context-harness"
version = "0.1.10"
description = "Local CLI harness for JIRA context retrieval"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7.0"]

[project.scripts]
jira-context = "jira_context_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]